# Build the platform image and publish it to GHCR — GitHub's own container
# registry. Authentication uses the built-in GITHUB_TOKEN, so there is NO
# personal access token to configure: the `packages: write` permission below
# is everything the push needs.
#
# VERSIONING — the code version in package.json is the source of truth:
#   - push to develop      → images `develop` + `sha-<short>` (dev channel)
#   - push tag `vX.Y.Z`    → images `X.Y.Z` + `X.Y` + `latest`
#   The workflow REFUSES a tag that does not match package.json, so a
#   published image version always names the code it was built from.
#
# Image: ghcr.io/janeirohurley/game-platform
#
# NOTE (public visibility): the first push creates the package as PRIVATE.
# For a Docker host to pull it without credentials, flip it to public under
# the repo's Packages settings, or `docker login ghcr.io` on that host.
#
# NOTE (build args): the realtime URL is inlined into the JS bundle at BUILD
# time. Set the repository variables NEXT_PUBLIC_REALTIME_URL (and optionally
# NEXT_PUBLIC_TURN_*) under Settings → Secrets and variables → Actions →
# Variables BEFORE relying on a published image — an empty value makes the
# app derive the realtime URL from the page origin at runtime.
#
# Deploy without building locally afterwards:
#   compose: replace `build:` with `image: ghcr.io/janeirohurley/game-platform:develop`

name: docker-publish

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_REALTIME_URL=${{ vars.NEXT_PUBLIC_REALTIME_URL }}
            NEXT_PUBLIC_TURN_URL=${{ vars.NEXT_PUBLIC_TURN_URL }}
            NEXT_PUBLIC_TURN_USERNAME=${{ vars.NEXT_PUBLIC_TURN_USERNAME }}
            NEXT_PUBLIC_TURN_CREDENTIAL=${{ vars.NEXT_PUBLIC_TURN_CREDENTIAL }}

      # ---------------------------------------------------------------------
      # Tooling image (`tools` stage): source + dev dependencies, no Next.js
      # build. It is what runs the Drizzle migrations (`bun run db:migrate`)
      # and `admin:create` against the database.
      #
      # The runtime image above is the `runner` stage: standalone output
      # only, no source, no drizzle-kit — it cannot migrate itself, so a
      # fresh database would stay empty. Published alongside it with a
      # `-tools` suffix:
      #   ghcr.io/janeirohurley/game-platform:0.5.7-tools
      #
      # No NEXT_PUBLIC_* build args here: this stage never builds a browser
      # bundle, so there is nothing to inline.
      #
      # `scope` keeps this build's layer cache separate from the runtime
      # build's, so the two do not evict each other on every run.
      # ---------------------------------------------------------------------
      - id: meta-tools
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=auto
            suffix=-tools,onlatest=true

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: ${{ steps.meta-tools.outputs.tags }}
          labels: ${{ steps.meta-tools.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools
