<!DOCTYPE html>
<html lang="fr">
<head>

<title>Ludo 4 joueurs (SVG statique)</title>

</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 537 537" width="640" role="img" aria-label="Plateau de Ludo 4 joueurs">
<!-- PLATEAU LUDO 4 JOUEURS - 2D, statique, sans JavaScript.
     Grille 15x15 : pas de 36 unites, case de 33 (joint de 3). Origine (0,0) en haut a gauche.
     Colonne c -> x = c*36 ; ligne r -> y = r*36.
     Couleurs : fond/joint #454545 | case #b0c2c2 | case sure #000 | panneau de base #c3c3c3 | anneau #7b7b7b
     Jaune : base #b79a14 case #c6a617 | Rouge : base #b93a28 case #d44630
     Vert(turquoise) : base #04969a case #0aa39f | Bleu : base #0a5aa8 case #0b65c4 -->
<defs>
  <!-- etoile en contour, centree sur (0,0) -->
  <polygon id="star" points="0,-12 2.9,-4 11.4,-3.7 4.8,1.5 7.1,9.7 0,5 -7.1,9.7 -4.8,1.5 -11.4,-3.7 -2.9,-4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
</defs>
<!-- fond / joints -->
<rect width="537" height="537" fill="#454545"/>

<!-- BRAS HAUT (ROUGE) : 3x6 cases, couloir de 5 cases, depart etoile, case sure noire -->
<g>
  <rect x="216" y="0" width="33" height="33" fill="#b0c2c2"/>
  <rect x="252" y="0" width="33" height="33" fill="#b0c2c2"/>
  <rect x="288" y="0" width="33" height="33" fill="#b0c2c2"/>
  <rect x="216" y="36" width="33" height="33" fill="#b0c2c2"/>
  <rect x="252" y="36" width="33" height="33" fill="#b0c2c2"/><rect x="255.6" y="39.6" width="25.8" height="25.8" fill="#d44630" stroke="#fff" stroke-opacity=".4"/> <!-- couloir -->
  <rect x="288" y="36" width="33" height="33" fill="#d44630"/><use href="#star" x="304.5" y="52.5" color="#ffc0b4"/> <!-- depart -->
  <rect x="216" y="72" width="33" height="33" fill="#000"/><use href="#star" x="232.5" y="88.5" color="#fff"/> <!-- case sure -->
  <rect x="252" y="72" width="33" height="33" fill="#b0c2c2"/><rect x="255.6" y="75.6" width="25.8" height="25.8" fill="#d44630" stroke="#fff" stroke-opacity=".4"/> <!-- couloir -->
  <rect x="288" y="72" width="33" height="33" fill="#b0c2c2"/>
  <rect x="216" y="108" width="33" height="33" fill="#b0c2c2"/>
  <rect x="252" y="108" width="33" height="33" fill="#b0c2c2"/><rect x="255.6" y="111.6" width="25.8" height="25.8" fill="#d44630" stroke="#fff" stroke-opacity=".4"/> <!-- couloir -->
  <rect x="288" y="108" width="33" height="33" fill="#b0c2c2"/>
  <rect x="216" y="144" width="33" height="33" fill="#b0c2c2"/>
  <rect x="252" y="144" width="33" height="33" fill="#b0c2c2"/><rect x="255.6" y="147.6" width="25.8" height="25.8" fill="#d44630" stroke="#fff" stroke-opacity=".4"/> <!-- couloir -->
  <rect x="288" y="144" width="33" height="33" fill="#b0c2c2"/>
  <rect x="216" y="180" width="33" height="33" fill="#b0c2c2"/>
  <rect x="252" y="180" width="33" height="33" fill="#b0c2c2"/><rect x="255.6" y="183.6" width="25.8" height="25.8" fill="#d44630" stroke="#fff" stroke-opacity=".4"/> <!-- couloir -->
  <rect x="288" y="180" width="33" height="33" fill="#b0c2c2"/>
</g>
<!-- BRAS GAUCHE (JAUNE) : 3x6 cases, couloir de 5 cases, depart etoile, case sure noire -->

  <rect x="0" y="288" width="33" height="33" fill="#b0c2c2"/>
  <rect x="0" y="252" width="33" height="33" fill="#b0c2c2"/>
  <rect x="0" y="216" width="33" height="33" fill="#b0c2c2"/>

  <rect x="108" y="216" width="33" height="33" fill="#b0c2c2"/>

</g>

  <rect x="216" y="324" width="33" height="33" fill="#b0c2c2"/>
</g>
<!-- BRAS DROITE (BLEU) : 3x6 cases, couloir de 5 cases, depart etoile, case sure noire -->

  <rect x="504" y="252" width="33" height="33" fill="#b0c2c2"/>

  <rect x="468" y="288" width="33" height="33" fill="#0b65c4"/><use href="#star" x="484.5" y="304.5" color="#b4d8ff"/> <!-- depart -->

  <rect x="432" y="288" width="33" height="33" fill="#b0c2c2"/>

</g>
<!-- BASE janeirohurley : 6x6 cases, cadre 23, panneau 167, anneaux a 25% et 75% -->

</g>
<!-- BASE Nel : 6x6 cases, cadre 23, panneau 167, anneaux a 25% et 75% -->

  <rect x="324" y="0" width="213" height="213" fill="#b93a28"/>

<!-- BASE Green : 6x6 cases, cadre 23, panneau 167, anneaux a 25% et 75% -->
